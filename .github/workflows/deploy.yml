name: deploy-instacap

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-check:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  deploy:
    name: Deploy to VM
    needs: build-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "Host length: ${#VM_HOST}"
          echo "User length: ${#VM_USER}"
          echo "Key length: ${#VM_SSH_KEY}"

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/id_ed25519 << 'EOF'
${{ secrets.VM_SSH_KEY }}
EOF

          chmod 600 ~/.ssh/id_ed25519

      - name: Validate key
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -vvv \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "whoami && hostname"

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
          set -e

          cd /home/nayabsarfaraj/captions

          git pull origin main
          npm install
          npm run worker:build
          npm run build

          pm2 restart caption-worker caption-web

          echo "Deployment completed."
          EOF